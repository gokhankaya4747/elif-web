<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A241D" />
<meta name="robots" content="noindex, nofollow" />
<title>Hatim Daveti — Elif</title>
<meta name="description" content="Birlikte hatim: boş bir cüz seç, oku, tamamla. Uygulama gerekmez." />
<!-- WhatsApp önizlemesi: davet linki genelde WhatsApp'ta paylaşılıyor -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Elif" />
<meta property="og:title" content="🤲 Hatim Daveti — bir cüz de sen oku" />
<meta property="og:description" content="Boş bir cüz seç, oku ve tamamla. Uygulama ya da hesap gerekmez." />
<meta property="og:image" content="https://elifmuslim.com/assets/og.png" />
<link rel="icon" type="image/png" href="../assets/icon.png" />
<link rel="apple-touch-icon" href="../assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ======================================================================
   ELIF — /h/?c=KOD  Hatim Daveti (hesapsız grup hatmi, web)
   Uygulamadaki app/hatim-davet ile AYNI sunucu fonksiyonlarını (ghp_*) kullanır;
   kimlik tarayıcıya özel rastgele anahtardır (localStorage).
   ====================================================================== */
:root{
  --green:#0E7C66; --green-900:#0A241D; --green-800:#0C3025;
  --cream:#F6F3EC; --muted:rgba(246,243,236,.72); --faint:rgba(246,243,236,.45);
  --gold:#D9A93B; --gold-soft:rgba(217,169,59,.22); --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,var(--green-800) 0%,var(--green-900) 60%);
  color:var(--cream);min-height:100vh;padding:28px 16px 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px;opacity:.9}
.brand img{width:34px;height:34px;border-radius:10px}
.brand span{font-family:Fraunces,serif;font-size:20px}
h1{font-family:Fraunces,serif;font-weight:600;font-size:26px;line-height:1.2;text-align:center;margin:0 0 6px}
.ded{text-align:center;color:var(--gold);font-weight:600;font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.big{font-family:Fraunces,serif;font-size:44px;text-align:center;line-height:1}
.big small{font-size:20px;color:var(--muted)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--green)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--cream);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;cursor:pointer;padding:2px}
.cell em{font-style:normal;font-size:9px;font-weight:500;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.9}
.cell.reading{background:var(--gold-soft);border-color:var(--gold)}
.cell.mine{background:var(--gold);border-color:var(--gold);color:#2A1E05}
.cell.done{background:var(--green);border-color:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.primary{background:var(--green);color:#fff}
.btn.gold{background:var(--gold);color:#2A1E05}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .panel{background:#0F2E24;border-top-left-radius:22px;border-top-right-radius:22px;padding:20px 18px 28px;width:100%;max-width:460px}
.sheet h2{font-family:Fraunces,serif;font-size:22px;margin:0 0 6px}
.msg{text-align:center;color:var(--muted);padding:40px 10px}
.done-banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:16px;padding:14px;text-align:center;margin-bottom:14px}
.app{display:flex;align-items:center;gap:12px}
.app img{width:52px;height:52px;border-radius:14px}
.app p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.app strong{color:var(--cream)}
.stores{display:flex;gap:8px;margin-top:12px}
.stores a{flex:1;margin-top:0}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:18px;line-height:1.5}
</style>
<script src="/assets/analytics.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../assets/icon.png" alt="" /><span>Elif</span></div>
  <div id="root"><div class="msg">Yükleniyor…</div></div>

  <div class="card app">
    <img src="../assets/icon.png" alt="Elif" />
    <p><strong>Cüzünü Elif'te oku</strong><br>Kur'an, namaz vakitleri ve hatim takibi tek uygulamada. Ücretsiz, reklamsız.</p>
  </div>
  <div class="stores">
    <a class="btn ghost" id="ios" href="https://apps.apple.com/app/id6776661502">App Store</a>
    <a class="btn ghost" id="android" href="https://play.google.com/store/apps/details?id=com.huzur.islamiasistan&referrer=utm_source%3Dhatim-davet">Google Play</a>
  </div>
  <div class="foot">Bu hatmi kuran kişi bir davet linki paylaştı. Elif bu sayfada yalnızca cüz seçerken yazdığın adı saklar.</div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
(function(){
  var SB = 'https://wcgaqdozedgzuipihklq.supabase.co/rest/v1/rpc/';
  // Uygulamadaki herkese açık (anon) anahtar — tablolar RLS ile kapalı, erişim yalnız ghp_* fonksiyonlarıyla.
  var ANON = 'sb_publishable_vTjoYkm8ibOVkpdymCY_Bw_r3lcvy8K';
  // Cüz başlangıçları (sûre, âyet) — Diyanet Kur'an portalında okumak için.
  var JUZ = [[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
  var KIND = {merhum:'Merhum için',kandil:'Kandil hatmi',sifa:'Şifa için',hayir:'Hayırlı bir niyet',genel:'Hatim'};

  var root = document.getElementById('root');
  var sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
  var code = '';
  try { code = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,6); } catch(e){}

  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  var token = store('elif_hd_token');
  if (!token || token.length < 16) {
    token = '';
    var a = new Uint8Array(24);
    try { crypto.getRandomValues(a); for (var i=0;i<a.length;i++) token += a[i].toString(36); } catch(e){ token = Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }
    token = (token + Date.now().toString(36)).slice(0,40);
    store('elif_hd_token', token);
  }
  var myName = store('elif_hd_name') || '';

  function track(ev, props){ try { if (window.posthog) posthog.capture(ev, Object.assign({code: code}, props||{})); } catch(e){} }

  function rpc(fn, body){
    return fetch(SB + fn, { method:'POST', headers:{ 'apikey':ANON, 'Authorization':'Bearer '+ANON, 'Content-Type':'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw j; return j; }); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function readUrl(j){ var p = JUZ[j-1]; return 'https://kuran.diyanet.gov.tr/mushaf/kuran-meal-1/sure-suresi-'+p[0]+'/ayet-'+p[1]+'/diyanet-isleri-meali-yeni-1'; }

  var state = null;
  function render(){
    if (!state) { root.innerHTML = '<div class="msg">Bu davet bulunamadı. Linki kontrol et.</div>'; return; }
    var done = 0, reading = 0;
    state.juz.forEach(function(j){ if (j.status==='done') done++; else if (j.status==='reading') reading++; });
    document.title = state.name + ' — Hatim Daveti';
    var h = '<h1>🤲 '+esc(state.name)+'</h1>';
    h += '<div class="ded">'+esc(KIND[state.kind]||'')+(state.dedication? ' · '+esc(state.dedication):'')+'</div>';
    if (done >= 30) h += '<div class="done-banner"><b>Hatim tamamlandı.</b><br>Rabbim kabul etsin, niyetinizi hayırla neticelendirsin.</div>';
    h += '<div class="card"><div class="big">'+done+'<small>/30</small></div><div class="sub">'+done+' cüz tamamlandı · '+reading+' cüz okunuyor</div><div class="bar"><i style="width:'+(done/30*100)+'%"></i></div></div>';
    h += '<div class="card"><p class="hint">Boş bir cüze dokun, adını yaz ve üstlen. Okuyunca “Tamamladım” de.</p><div class="grid">';
    state.juz.forEach(function(j){
      var cls = 'cell ' + (j.status==='done' ? 'done' : j.status==='reading' ? (j.mine?'mine':'reading') : '');
      var label = j.status==='done' ? '✓' : (j.status==='reading' ? esc(j.mine ? 'Sen' : (j.name||'')) : '');
      h += '<button class="'+cls+'" data-j="'+j.juz+'">'+j.juz+'<em>'+label+'</em></button>';
    });
    h += '</div><div class="legend"><span><b></b>Boş</span><span><b style="background:var(--gold-soft);border-color:var(--gold)"></b>Okunuyor</span><span><b style="background:var(--gold)"></b>Senin</span><span><b style="background:var(--green)"></b>Tamamlandı</span></div></div>';
    h += '<button class="btn primary" id="share">WhatsApp\'ta paylaş</button>';
    root.innerHTML = h;
    Array.prototype.forEach.call(root.querySelectorAll('.cell'), function(b){ b.addEventListener('click', function(){ onCell(+b.getAttribute('data-j')); }); });
    document.getElementById('share').addEventListener('click', function(){
      var text = '🤲 '+state.name+'\nHer birimiz bir cüz okuyalım. Cüzünü buradan seç:\n'+location.origin+'/h/?c='+state.code+'\n(Elif uygulamasında kod: '+state.code+')';
      track('hatim_davet_web_share');
      if (navigator.share) navigator.share({ text: text }).catch(function(){});
      else window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank');
    });
  }

  function openSheet(html){ panel.innerHTML = html; sheet.className = 'sheet on'; }
  function closeSheet(){ sheet.className = 'sheet'; }
  sheet.addEventListener('click', function(e){ if (e.target === sheet) closeSheet(); });

  function setJuz(j, status, name){
    return rpc('ghp_set', { p_code: code, p_juz: j, p_status: status, p_name: name || myName, p_token: token })
      .then(function(s){ state = s; render(); closeSheet(); track('hatim_davet_web_juz', { status: status }); })
      .catch(function(err){
        closeSheet();
        alert(err && /taken/.test(err.message||'') ? 'Bu cüzü başka biri almış.' : 'Bağlantı kurulamadı, tekrar dene.');
        load();
      });
  }

  function onCell(j){
    var c = state.juz[j-1];
    if (c.status === 'open') {
      openSheet('<h2>'+j+'. cüzü üstlen</h2><p class="hint">Adın listede görünecek.</p><label>Adın</label><input id="nm" maxlength="40" value="'+esc(myName)+'" placeholder="Adın" /><button class="btn primary" id="ok">Üstlen</button><button class="btn ghost" id="cx">Vazgeç</button>');
      document.getElementById('cx').onclick = closeSheet;
      document.getElementById('ok').onclick = function(){
        var n = (document.getElementById('nm').value||'').trim();
        if (!n) { document.getElementById('nm').focus(); return; }
        myName = n.slice(0,40); store('elif_hd_name', myName);
        setJuz(j, 'reading', myName);
      };
    } else if (c.mine && c.status === 'reading') {
      openSheet('<h2>'+j+'. cüz senin</h2><a class="btn gold" target="_blank" rel="noopener" href="'+readUrl(j)+'">Cüzü oku (Diyanet Kur\'an Portalı)</a><button class="btn primary" id="dn">Okudum, tamamladım</button><button class="btn ghost" id="rl">Bırak</button>');
      document.getElementById('dn').onclick = function(){ setJuz(j, 'done'); };
      document.getElementById('rl').onclick = function(){ setJuz(j, 'open'); };
    } else if (c.mine && c.status === 'done') {
      window.open(readUrl(j), '_blank');
    } else {
      alert('Bu cüzü başka biri almış.');
    }
  }

  function load(){
    if (!code) { state = null; render(); return; }
    rpc('ghp_state', { p_code: code, p_token: token }).then(function(s){ state = s; render(); }).catch(function(){ root.innerHTML = '<div class="msg">Bağlantı kurulamadı. Sayfayı yenile.</div>'; });
  }
  load();
  track('hatim_davet_web_view');
  setInterval(function(){ if (!document.hidden && sheet.className.indexOf('on') < 0) load(); }, 20000);
  ['ios','android'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(){ track('web_store_click', { platform: id, src: 'hatim-davet' }); }); });
})();
</script>
</body>
</html>
