<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A241D" />
<meta name="robots" content="noindex, follow" />

<title>Elif'i indir</title>
<meta name="description" content="Elif — namaz vakitleri, Kur'an-ı Kerim, kıble ve günlük ayet widget'ları. %100 reklamsız." />

<link rel="icon" type="image/png" href="../assets/icon.png" />
<link rel="apple-touch-icon" href="../assets/icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ======================================================================
   ELIF — /indir  akıllı yönlendirme sayfası
   Reklamlardan gelen kullanıcıyı cihazına göre doğrudan mağazaya atar.
   Mağaza linklerini değiştirmek için en alttaki APP_STORE_URL /
   PLAY_STORE_URL değerlerini güncelle (index.html ile aynı tutulmalı).
   ====================================================================== */
:root{
  --green:#0E7C66;
  --green-600:#0B6B58;
  --green-900:#0A241D;
  --green-800:#0C3025;
  --cream:#F6F3EC;
  --muted:rgba(246,243,236,.72);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, var(--green-800) 0%, var(--green-900) 60%);
  color:var(--cream);
  display:flex; align-items:center; justify-content:center;
  padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%; max-width:420px; text-align:center}

.logo{
  width:88px; height:88px; border-radius:24px; margin:0 auto 24px;
  display:block; box-shadow:0 18px 40px rgba(0,0,0,.35);
}

h1{
  font-family:Fraunces,Georgia,serif;
  font-weight:600; font-size:28px; line-height:1.25;
  margin:0 0 10px;
}
p.sub{
  margin:0 0 28px; font-size:15.5px; line-height:1.6; color:var(--muted);
}

.status{
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:14px; color:var(--muted); margin-bottom:24px; min-height:22px;
}
.spinner{
  width:16px; height:16px; border-radius:50%;
  border:2px solid rgba(246,243,236,.25); border-top-color:var(--cream);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spinner{animation-duration:2.4s} }

.btns{display:flex; flex-direction:column; gap:12px}
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:16px 20px; border-radius:16px;
  font-size:16px; font-weight:600; text-decoration:none;
  transition:transform .15s ease, opacity .15s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cream); color:var(--green-900)}
.btn-secondary{
  background:rgba(246,243,236,.08); color:var(--cream);
  border:1px solid rgba(246,243,236,.18);
}
.btn svg{width:20px; height:20px; flex:none}

.note{margin-top:26px; font-size:13px; line-height:1.6; color:rgba(246,243,236,.5)}
.note a{color:rgba(246,243,236,.72)}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="../assets/icon.png" alt="Elif" />

  <h1>Elif'i indir</h1>
  <p class="sub">Namaz vakitleri, Kur'an-ı Kerim, kıble ve her saat yenilenen ayet widget'ları — %100 reklamsız.</p>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="spinner" id="spinner" aria-hidden="true"></span>
    <span id="statusText">Mağazaya yönlendiriliyorsun…</span>
  </div>

  <div class="btns">
    <a class="btn btn-primary" id="appstore" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.42 2.2-1.14 3.02-.86.99-2.27 1.76-3.42 1.66-.14-1.1.42-2.26 1.1-3 .78-.85 2.14-1.5 3.46-1.68zM20.7 17.1c-.6 1.36-.9 1.96-1.66 3.16-1.07 1.68-2.58 3.77-4.45 3.78-1.66.02-2.08-1.08-4.33-1.07-2.25.01-2.72 1.09-4.38 1.08-1.87-.02-3.3-1.91-4.37-3.58C-1.5 16.8-1.8 11.1.9 8.08c1.06-1.2 2.6-1.96 4.05-1.96 1.48 0 2.4 1.08 3.62 1.08 1.18 0 1.9-1.08 3.6-1.08 1.3 0 2.68.7 3.66 1.92-3.22 1.76-2.7 6.36.87 7.06z"/></svg>
      App Store'dan indir
    </a>
    <a class="btn btn-secondary" id="playstore" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 1.9c-.3.3-.5.8-.5 1.4v17.4c0 .6.2 1.1.5 1.4l.1.1 9.8-9.8v-.2L3.7 1.8l-.1.1zM17.3 15.4l-3.2-3.2v-.2l3.2-3.2.1.1 3.9 2.2c1.1.6 1.1 1.6 0 2.3l-3.9 2.2-.1-.2zM14.2 12.6l3.3 3.3-9.9 5.6c-.4.2-.8.2-1.1 0l7.7-8.9zM14.2 11.4L6.5 2.5c.3-.2.7-.2 1.1 0l9.9 5.6-3.3 3.3z"/></svg>
      Google Play'den indir
    </a>
  </div>

  <p class="note">Otomatik yönlendirme çalışmazsa yukarıdaki butona dokun.<br />
    <a href="../">elifmuslim.com</a></p>
</main>

<script>
/* ====================================================================
   MAĞAZA LİNKLERİ — index.html ile aynı tutulmalı.
   ==================================================================== */
var APP_STORE_URL  = "https://apps.apple.com/app/id6776661502";
var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.huzur.islamiasistan";

var appstore  = document.getElementById('appstore');
var playstore = document.getElementById('playstore');
appstore.href  = APP_STORE_URL;
playstore.href = PLAY_STORE_URL;

var ua = navigator.userAgent || "";
var isIOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPadOS */
var isAndroid = /Android/.test(ua);

var statusEl = document.getElementById('status');
var statusText = document.getElementById('statusText');
var spinner = document.getElementById('spinner');

function stopSpinner(msg){
  if (spinner) spinner.remove();
  statusText.textContent = msg;
}

if (isIOS || isAndroid) {
  /* Butonu görsel olarak öne çıkar: iOS'ta App Store, Android'de Play üstte dursun */
  if (isAndroid) {
    playstore.className = 'btn btn-primary';
    appstore.className  = 'btn btn-secondary';
    playstore.parentNode.insertBefore(playstore, appstore);
  }
  /* Kısa bir gecikme: sayfa görünsün, sonra mağazaya devret.
     Instagram/Facebook içi tarayıcıda da bu şekilde güvenilir çalışıyor. */
  setTimeout(function(){
    window.location.href = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;
    /* Yönlendirme gerçekleşmediyse kullanıcıyı butona yönlendir */
    setTimeout(function(){
      stopSpinner('Açılmadıysa aşağıdaki butona dokun.');
    }, 2500);
  }, 700);
} else {
  /* Masaüstü: otomatik yönlendirme yok, iki seçenek de dursun */
  stopSpinner('Cihazına uygun mağazayı seç.');
}
</script>
</body>
</html>
